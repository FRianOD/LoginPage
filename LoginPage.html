<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:ital,wght@0,100;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <header>
            <nav class="nav-bar">
                <div class="logo">
                    <a href="../HomePage/HomePage.html"><h1 class="texto">Kerb <span>Sec</span></h1></a>
                </div>
                <ul>
                    <li><a href="#" class="texto">Home</a></li>
                    <li><a href="#" class="texto">About</a></li>
                    <li><a href="#" class="texto">Portifolio</a></li>
                    <li><a href="#" class="texto">Channel</a></li>
                </ul>
                <div class="toggle-button-container">
                    <div class="toggle-button">
                        <input type="checkbox" id="font-color">
                        <label for="font-color" class="button"></label>
                    </div>
                </div>
                <a href="../LoginPage/LoginPage.html"><button class="btn texto">Subscribe</button></a>
            </nav>
        </header>
        <div class="login-card-container">
            <div class="login-card">
                <div class="login-card-header">
                    <h2>login</h2>
                </div>
                <form action="" class="form-box">
                    <div class="form-item">
                        <input type="text" required autofocus>
                        <label for="">Email</label>
                    </div>
                    <div class="form-item">
                        <input type="password" required>
                        <label for="">Password</label>
                    </div>
                    <div class="form-item-other">
                        <div class="checkbox">
                            <input type="checkbox" id="rememberMeCheckbox">
                            <label for="rememberMeCheckBox">Remember me</label>
                        </div>
                        <a class="forgotPWD"href="#">I forgot my password</a>
                    </div>
                    <button class="submite">submite</button>
                    <div class="RegisterText">Don't have an accont?<a class="RegisterLink"href="../RegisterPage/index.html">Register</a></div>
                </form>
            </div>
        </div>
    </div>
    <script>
        let tb = document.getElementById("font-color");
        tb.onclick = function(){
            document.body.classList.toggle("dark-theme");
        }
    </script>
</body>
</html>
